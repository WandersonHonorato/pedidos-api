openapi: 3.0.3
info:
  title: Pedidos API
  version: 1.0.0
  description: |
    API de domínio único (pedidos). Fluxo principal: **criar → consultar → pagar**.
    Endpoint principal: `POST /pedidos`.
    Valores monetários são inteiros em centavos (evita erro de ponto flutuante).
  contact:
    name: Lucas
    url: https://github.com/
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local (docker compose)
tags:
  - name: pedidos
    description: Fluxo principal
  - name: operacao
    description: Saúde e métricas
paths:
  /pedidos:
    post:
      tags: [pedidos]
      operationId: criarPedido
      summary: Cria um pedido
      description: O total é sempre calculado pelo servidor; o cliente não envia total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPedido'
            example:
              cliente: Carla
              itens:
                - produto: Teclado
                  quantidade: 1
                  precoUnitarioCentavos: 19900
                - produto: Mouse
                  quantidade: 2
                  precoUnitarioCentavos: 4500
      responses:
        '201':
          description: Pedido criado
          headers:
            Location:
              description: URL do pedido criado
              schema:
                type: string
                example: /pedidos/3f1c2a9e-8b7d-4e2a-9c1f-0a1b2c3d4e5f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
              example:
                id: 3f1c2a9e-8b7d-4e2a-9c1f-0a1b2c3d4e5f
                cliente: Carla
                itens:
                  - produto: Teclado
                    quantidade: 1
                    precoUnitarioCentavos: 19900
                  - produto: Mouse
                    quantidade: 2
                    precoUnitarioCentavos: 4500
                totalCentavos: 28900
                status: CRIADO
                criadoEm: '2026-11-16T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/Erro400'
        '500':
          $ref: '#/components/responses/Erro500'
  /pedidos/{id}:
    get:
      tags: [pedidos]
      operationId: obterPedido
      summary: Consulta um pedido
      description: Retorna o pedido com itens, total calculado e status atual.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '404':
          $ref: '#/components/responses/Erro404'
  /pedidos/{id}/pagamento:
    post:
      tags: [pedidos]
      operationId: pagarPedido
      summary: Paga um pedido (CRIADO → PAGO)
      description: Só pedidos em status CRIADO podem ser pagos; pagar de novo retorna 409.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          description: Pedido não está em status que permite pagamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /health:
    get:
      tags: [operacao]
      operationId: health
      summary: Liveness
      description: Usado pelo healthcheck do docker compose.
      responses:
        '200':
          description: Serviço no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      tags: [operacao]
      operationId: metrics
      summary: Métricas Prometheus
      description: Inclui o histograma http_request_duration_seconds, base do SLO.
      responses:
        '200':
          description: Métricas no formato texto do Prometheus
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Item:
      type: object
      required: [produto, quantidade, precoUnitarioCentavos]
      properties:
        produto:
          type: string
          minLength: 1
          example: Teclado
        quantidade:
          type: integer
          minimum: 1
          example: 1
        precoUnitarioCentavos:
          type: integer
          minimum: 1
          example: 19900
    NovoPedido:
      type: object
      required: [cliente, itens]
      properties:
        cliente:
          type: string
          minLength: 1
          example: Carla
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Item'
    Pedido:
      type: object
      required: [id, cliente, itens, totalCentavos, status, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        cliente:
          type: string
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        totalCentavos:
          type: integer
          example: 28900
        status:
          type: string
          enum: [CRIADO, PAGO, CANCELADO]
        criadoEm:
          type: string
          format: date-time
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string
  responses:
    Erro400:
      description: Entrada inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: pedido precisa ter ao menos 1 item
    Erro404:
      description: Pedido não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Pedido 3f1c2a9e-8b7d-4e2a-9c1f-0a1b2c3d4e5f não encontrado
    Erro500:
      description: Erro interno (sem detalhes vazados)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: erro interno
