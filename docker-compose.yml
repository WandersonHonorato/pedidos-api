# Sobe tudo com: docker compose up --build
# Pré-requisito único: ter o arquivo .env (cp .env.example .env).
# Nenhuma senha está escrita aqui: tudo vem do .env, que está no .gitignore.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env (cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (cp .env.example .env)}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env (cp .env.example .env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPOSITORY: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
